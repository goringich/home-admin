name: home-admin-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests in isolated processes
        run: |
          mapfile -t tests < <(find scripts -maxdepth 1 -type f -name '*.test.mjs' | sort)
          test "${#tests[@]}" -gt 0
          for test_file in "${tests[@]}"; do
            node --test "$test_file"
          done
      - name: Lint and typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
      - name: Build
        run: npm run build
