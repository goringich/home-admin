name: home-admin-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository_owner == 'goringich'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run Node validation in an isolated ephemeral container
        run: |
          set -Eeuo pipefail
          command -v docker
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            --user "${runner_uid}:${runner_gid}" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=1024 \
            --memory=6g \
            --cpus=4 \
            -e HOME=/tmp/ci-home \
            -e npm_config_cache=/tmp/npm-cache \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            node:22-bookworm-slim \
            sh -euc '
              mkdir -p "$HOME" "$npm_config_cache"
              npm ci
              test -n "$(find scripts -maxdepth 1 -type f -name "*.test.mjs" -print -quit)"
              find scripts -maxdepth 1 -type f -name "*.test.mjs" -print0 \
                | sort -z \
                | xargs -0 -r -n1 node --test
              npm run lint --if-present
              npm run typecheck --if-present
              npm run build
            '

  windows-agent:
    if: github.repository_owner == 'goringich'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Parse Windows agent scripts in bounded PowerShell container
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          command -v docker
          docker run --rm \
            --network=none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=1g \
            --cpus=2 \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            mcr.microsoft.com/powershell:7.4-ubuntu-22.04 \
            pwsh -NoLogo -NoProfile -File scripts/ci-validate-windows-agent.ps1
