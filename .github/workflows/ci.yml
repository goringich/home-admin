name: home-admin-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository_owner == 'goringich' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, goringich-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run Node validation in an isolated container
        run: |
          command -v docker
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/ci-home \
            -e npm_config_cache=/tmp/npm-cache \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            node:22-bookworm-slim \
            sh -euc '
              npm ci
              find scripts -maxdepth 1 -type f -name "*.test.mjs" -print0 \
                | sort -z \
                | xargs -0 -r -n1 node --test
              npm run lint --if-present
              npm run typecheck --if-present
              npm run build
            '

  windows-agent:
    if: >-
      github.repository_owner == 'goringich' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, goringich-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Parse Windows agent scripts in PowerShell container
        run: |
          command -v docker
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            mcr.microsoft.com/powershell:7.4-ubuntu-22.04 \
            pwsh -NoLogo -NoProfile -File scripts/ci-validate-windows-agent.ps1
