name: One-shot endpoint migration

on:
  push:
    paths:
      - ".github/workflows/one-shot-endpoint-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace retired endpoint
        env:
          OLD_IP: 178.236.253.46
          NEW_IP: 2.26.250.194
          OLD_NIP: 178-236-253-46.nip.io
          NEW_NIP: 2-26-250-194.nip.io
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          replacements = {
            os.environ["OLD_IP"]: os.environ["NEW_IP"],
            os.environ["OLD_NIP"]: os.environ["NEW_NIP"],
          }

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []
          for raw_path in paths:
            if not raw_path:
              continue
            path = Path(raw_path)
            try:
              original = path.read_text(encoding="utf-8")
            except (UnicodeDecodeError, OSError):
              continue
            updated = original
            for old, new in replacements.items():
              updated = updated.replace(old, new)
            if updated != original:
              path.write_text(updated, encoding="utf-8")
              changed.append(raw_path)

          print(f"updated_files={len(changed)}")
          for path in changed:
            print(path)
          PY

      - name: Commit migration and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-endpoint-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No endpoint references required changes."
            exit 0
          fi
          git commit -m "fix(infra): migrate endpoint to 2.26.250.194"
          git push
